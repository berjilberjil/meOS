# MyOS backend deploys from apps/web.
[build]
  base    = "apps/web"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  # Force the Netlify SvelteKit adapter on every build (git or CLI), so a local
  # `netlify deploy --build` can't fall back to adapter-node and ship a broken site.
  NETLIFY = "true"

# Keep the whole site out of search engines — private personal backend.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
