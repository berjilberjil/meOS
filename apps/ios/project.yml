name: meOS
options:
  bundleIdPrefix: com.berjil
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.9"
schemes:
  meOS:
    build:
      targets:
        meOS: all
targets:
  meOS:
    type: application
    platform: iOS
    sources:
      # iOS-only: app entry + the tab shell + a lightweight Settings screen.
      - path: Sources
        excludes:
          # Belongs to the meOSShare target, not the app.
          - "Share/**"
      # Shared with apps/mac — the whole logic layer (AppState, APIClient,
      # models, crypto) plus every view that has no AppKit dependency. Kept as
      # ONE source of truth in apps/mac/Sources; nothing here is a copy.
      - path: ../mac/Sources/meOS/Support
        excludes:
          - "VideoMedia.swift"   # AVFoundation compression, macOS-only for now — Events tab isn't ported yet
      - path: ../mac/Sources/meOS/Views/RootView.swift
      - path: ../mac/Sources/meOS/Views/VaultViews.swift
      - path: ../mac/Sources/meOS/Views/LoginView.swift
      - path: ../mac/Sources/meOS/Views/TodayView.swift
      - path: ../mac/Sources/meOS/Views/ScanView.swift
      - path: ../mac/Sources/meOS/Views/FoldView.swift
      - path: ../mac/Sources/meOS/Views/FitnessView.swift
      - path: ../mac/Sources/meOS/Views/FitnessTodayView.swift
      - path: ../mac/Sources/meOS/Views/WeeklyPlannerView.swift
      - path: ../mac/Sources/meOS/Views/FitnessLibraryView.swift
      - path: ../mac/Sources/meOS/Views/FoodView.swift
      - path: ../mac/Sources/meOS/Views/WorkoutView.swift
      - path: ../mac/Sources/meOS/Views/ProgramsView.swift
      - path: ../mac/Sources/meOS/Views/ProgramDayView.swift
      - path: ../mac/Sources/meOS/Views/WorkoutSessionView.swift
      - path: ../mac/Sources/meOS/Views/WorkoutHistoryView.swift
      - path: ../mac/Sources/meOS/Views/GIFView.swift
      - path: ../mac/Sources/meOS/Views/BodyView.swift
      - path: ../mac/Sources/meOS/Views/JournalView.swift
      - path: ../mac/Sources/meOS/Views/ChatWidget.swift
      - path: ../mac/Sources/meOS/Views/AIProvidersCard.swift
      - path: ../mac/Sources/meOS/Views/AgentSettingsCard.swift
      - path: ../mac/Sources/meOS/Views/MemoryCard.swift
      - path: ../mac/Sources/meOS/Views/AppearanceCard.swift
      - path: ../mac/Sources/meOS/Views/GeneralSettingsCard.swift
      - path: ../mac/Sources/meOS/Views/NotificationsCard.swift
      # Activity intelligence — the Today card, the Productivity analytics, the
      # weekly report section and the settings/setup screens. All platform-neutral.
      - path: ../mac/Sources/meOS/Views/Activity
      - path: ../mac/Sources/meOS/Views/Editors.swift
      - path: ../mac/Sources/meOS/Views/CalendarComponents.swift
      - path: ../mac/Sources/meOS/Views/DayPager.swift
      - path: ../mac/Sources/meOS/Views/DayDetailView.swift
      - path: ../mac/Sources/meOS/Views/ProgressPhotoCalendar.swift
      - path: ../mac/Sources/meOS/Views/FocusView.swift
      - path: ../mac/Sources/meOS/Views/TaskModeView.swift
      - path: ../mac/Sources/meOS/Views/SlideToComplete.swift
      - path: ../mac/Sources/meOS/Views/ScanHistory.swift
      # One grid for every picture and video the app holds — no AppKit in it.
      - path: ../mac/Sources/meOS/Views/GalleryView.swift
      - path: ../mac/Sources/meOS/Views/ActivitySheet.swift
      # The streak (steps, not journaling) and the goal celebration. Both are
      # platform-neutral; the photo comparison beside them is Mac-only on purpose.
      # The weight dial — Today and Fitness both show it; the maths beside it
      # in Support/ comes along with the whole directory.
      - path: ../mac/Sources/meOS/Views/WeightDial.swift
      # The weight trend chart — Charts only, no AppKit.
      - path: ../mac/Sources/meOS/Views/WeightHistoryCard.swift
      - path: ../mac/Sources/meOS/Views/StepStreak.swift
      - path: ../mac/Sources/meOS/Views/StepCelebration.swift
      - path: ../mac/Sources/meOS/Views/MacroPulseView.swift
      - path: ../mac/Sources/meOS/Views/MacroMetricDetail.swift
      - path: ../mac/Sources/meOS/Views/MacroMethodSheet.swift
      - path: ../mac/Sources/meOS/Views/WeeklyReportCard.swift
      - path: ../mac/Sources/meOS/Views/DangerConfirm.swift
      # The recycle bin — one screen, both platforms.
      - path: ../mac/Sources/meOS/Views/TrashView.swift
      # Time / repeat / reminders — the same rule editor on both platforms, so a
      # yearly event means the same thing wherever it was created.
      - path: ../mac/Sources/meOS/Views/EventScheduleEditor.swift
      - path: ../mac/Sources/meOS/Views/Icons.swift
      - path: ../mac/Sources/meOS/Views/SettingsKit.swift
      - path: ../mac/Sources/meOS/Views/SharedComponents.swift
      - path: ../mac/Sources/meOS/Views/ImageDropZone.swift
      - path: ../mac/Sources/meOS/Views/WatchLogCard.swift
      - path: ../mac/Sources/meOS/Views/SplashView.swift
      - path: ../mac/Sources/meOS/Views/BelongingsView.swift
      - path: ../mac/Sources/meOS/Views/ProductivityView.swift
      - path: ../mac/Sources/meOS/Resources/drop.wav
        buildPhase: resources
      # Every reminder sound, as a file. iOS resolves a named notification sound
      # only against the bundle, so without these the phone could offer three
      # sounds while the Mac offered sixteen.
      - path: ../mac/Sources/meOS/Resources/Sounds
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berjil.myos
        INFOPLIST_FILE: Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ACDQ327MPR
        TARGETED_DEVICE_FAMILY: "1,2"
        # App Group only. NOT meOS.entitlements — that one also asks for
        # HealthKit, which isn't on the App ID yet and would fail to provision.
        CODE_SIGN_ENTITLEMENTS: AppGroup.entitlements
    dependencies:
      - target: meOSShare
        embed: true

  # "Share → meOS" from YouTube. Queues the link into the App Group container;
  # the app turns it into a Productivity entry when it next comes to the front.
  meOSShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Share
      # One source of truth, same convention as the app target — the link parser
      # and the App Group hand-off come straight from apps/mac/Sources.
      - path: ../mac/Sources/meOS/Support/YouTubeClient.swift
      - path: ../mac/Sources/meOS/Support/ShareInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berjil.myos.Share
        INFOPLIST_FILE: Share-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ACDQ327MPR
        CODE_SIGN_ENTITLEMENTS: ShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
