name: MyOS
options:
  bundleIdPrefix: com.berjil
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.9"
schemes:
  MyOS:
    build:
      targets:
        MyOS: all
targets:
  MyOS:
    type: application
    platform: iOS
    sources:
      # iOS-only: app entry + the tab shell + a lightweight Settings screen.
      - path: Sources
        excludes:
          # Belongs to the MyOSShare target, not the app.
          - "Share/**"
      # Shared with apps/mac — the whole logic layer (AppState, APIClient,
      # models, crypto) plus every view that has no AppKit dependency. Kept as
      # ONE source of truth in apps/mac/Sources; nothing here is a copy.
      - path: ../mac/Sources/MyOS/Support
        excludes:
          - "VideoMedia.swift"   # AVFoundation compression, macOS-only for now — Events tab isn't ported yet
      - path: ../mac/Sources/MyOS/Views/RootView.swift
      - path: ../mac/Sources/MyOS/Views/VaultViews.swift
      - path: ../mac/Sources/MyOS/Views/LoginView.swift
      - path: ../mac/Sources/MyOS/Views/TodayView.swift
      - path: ../mac/Sources/MyOS/Views/ScanView.swift
      - path: ../mac/Sources/MyOS/Views/FoldView.swift
      - path: ../mac/Sources/MyOS/Views/FitnessView.swift
      - path: ../mac/Sources/MyOS/Views/FitnessTodayView.swift
      - path: ../mac/Sources/MyOS/Views/WeeklyPlannerView.swift
      - path: ../mac/Sources/MyOS/Views/FitnessLibraryView.swift
      - path: ../mac/Sources/MyOS/Views/FoodView.swift
      - path: ../mac/Sources/MyOS/Views/WorkoutView.swift
      - path: ../mac/Sources/MyOS/Views/ProgramsView.swift
      - path: ../mac/Sources/MyOS/Views/ProgramDayView.swift
      - path: ../mac/Sources/MyOS/Views/WorkoutSessionView.swift
      - path: ../mac/Sources/MyOS/Views/WorkoutHistoryView.swift
      - path: ../mac/Sources/MyOS/Views/GIFView.swift
      - path: ../mac/Sources/MyOS/Views/BodyView.swift
      - path: ../mac/Sources/MyOS/Views/JournalView.swift
      - path: ../mac/Sources/MyOS/Views/ChatWidget.swift
      - path: ../mac/Sources/MyOS/Views/AIProvidersCard.swift
      - path: ../mac/Sources/MyOS/Views/AgentSettingsCard.swift
      - path: ../mac/Sources/MyOS/Views/MemoryCard.swift
      - path: ../mac/Sources/MyOS/Views/AppearanceCard.swift
      - path: ../mac/Sources/MyOS/Views/GeneralSettingsCard.swift
      - path: ../mac/Sources/MyOS/Views/NotificationsCard.swift
      # Activity intelligence — the Today card, the Productivity analytics, the
      # weekly report section and the settings/setup screens. All platform-neutral.
      - path: ../mac/Sources/MyOS/Views/Activity
      - path: ../mac/Sources/MyOS/Views/Editors.swift
      - path: ../mac/Sources/MyOS/Views/CalendarComponents.swift
      - path: ../mac/Sources/MyOS/Views/DayPager.swift
      - path: ../mac/Sources/MyOS/Views/DayDetailView.swift
      - path: ../mac/Sources/MyOS/Views/ProgressPhotoCalendar.swift
      - path: ../mac/Sources/MyOS/Views/FocusView.swift
      - path: ../mac/Sources/MyOS/Views/TaskModeView.swift
      - path: ../mac/Sources/MyOS/Views/SlideToComplete.swift
      - path: ../mac/Sources/MyOS/Views/ScanHistory.swift
      # One grid for every picture and video the app holds — no AppKit in it.
      - path: ../mac/Sources/MyOS/Views/GalleryView.swift
      - path: ../mac/Sources/MyOS/Views/ActivitySheet.swift
      - path: ../mac/Sources/MyOS/Views/MacroPulseView.swift
      - path: ../mac/Sources/MyOS/Views/MacroMetricDetail.swift
      - path: ../mac/Sources/MyOS/Views/MacroMethodSheet.swift
      - path: ../mac/Sources/MyOS/Views/WeeklyReportCard.swift
      - path: ../mac/Sources/MyOS/Views/DangerConfirm.swift
      - path: ../mac/Sources/MyOS/Views/Icons.swift
      - path: ../mac/Sources/MyOS/Views/SettingsKit.swift
      - path: ../mac/Sources/MyOS/Views/SharedComponents.swift
      - path: ../mac/Sources/MyOS/Views/ImageDropZone.swift
      - path: ../mac/Sources/MyOS/Views/WatchLogCard.swift
      - path: ../mac/Sources/MyOS/Views/SplashView.swift
      - path: ../mac/Sources/MyOS/Views/BelongingsView.swift
      - path: ../mac/Sources/MyOS/Views/ProductivityView.swift
      - path: ../mac/Sources/MyOS/Resources/drop.wav
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berjil.myos
        INFOPLIST_FILE: Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ACDQ327MPR
        TARGETED_DEVICE_FAMILY: "1,2"
        # App Group only. NOT MyOS.entitlements — that one also asks for
        # HealthKit, which isn't on the App ID yet and would fail to provision.
        CODE_SIGN_ENTITLEMENTS: AppGroup.entitlements
    dependencies:
      - target: MyOSShare
        embed: true

  # "Share → MyOS" from YouTube. Queues the link into the App Group container;
  # the app turns it into a Productivity entry when it next comes to the front.
  MyOSShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Share
      # One source of truth, same convention as the app target — the link parser
      # and the App Group hand-off come straight from apps/mac/Sources.
      - path: ../mac/Sources/MyOS/Support/YouTubeClient.swift
      - path: ../mac/Sources/MyOS/Support/ShareInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berjil.myos.Share
        INFOPLIST_FILE: Share-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ACDQ327MPR
        CODE_SIGN_ENTITLEMENTS: ShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
