name: meOS
options:
  bundleIdPrefix: com.berjil
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.9"
schemes:
  meOS:
    build:
      targets:
        meOS: all
    test:
      targets:
        - meOSTests
targets:
  meOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berjil.myos
        INFOPLIST_FILE: Info.plist
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: meOS.entitlements
  meOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: meOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berjil.myos.tests
        GENERATE_INFOPLIST_FILE: YES
