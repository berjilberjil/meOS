name: meOS
options:
  bundleIdPrefix: com.berjil
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
schemes:
  meOS:
    build:
      targets:
        meOS: all
targets:
  meOS:
    type: application
    platform: macOS
    sources:
      # The rebuilt app: new entry, new shell, new screens. Written for the
      # balanced-white redesign; nothing from the old Mac UI is compiled.
      - path: Sources
      # The shared logic layer — the exact same files the iOS app compiles.
      # One source of truth, untouched by this rebuild.
      - path: ../mac/Sources/meOS/Support
      # The shared views — the ones the iOS app compiles. The four old Mac
      # screens this rebuild replaces are excluded by name (they collide with
      # the new files); everything else compiles exactly as iOS sees it.
      - path: ../mac/Sources/meOS/Views
        excludes:
          - "MainView.swift"      # old sidebar shell  -> Sources/MainView.swift
          - "SettingsView.swift"  # old settings       -> Sources/SettingsView.swift
          - "NotesView.swift"     # old notes          -> Sources/NotesView.swift
          - "SplashView.swift"    # old launch screen  -> gone
          - "MenuBarView.swift"   # old menu-bar extra -> gone (v2)
          - "RootView.swift"      # old root/splash gate -> new meOSApp hosts MainView
      - path: ../mac/Sources/meOS/Resources/drop.wav
        buildPhase: resources
      - path: ../mac/Sources/meOS/Resources/Sounds
        buildPhase: resources
      - path: ../mac/Sources/meOS/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berjil.myos
        INFOPLIST_FILE: Info.plist
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
