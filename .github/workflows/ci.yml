name: CI

on:
  push:
    branches: [main]
  pull_request:

# There is no root package.json — this is a monorepo of apps/api (SvelteKit on
# Cloudflare Workers) plus three MCP servers (diet, stuff, meos). Each job
# installs in its own directory. CI does not build the full Swift app; the pure
# finance domain has its own SwiftPM suite below.
jobs:
  api:
    name: API — type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: svelte-check
        run: bun run check

      # Pure-function suites: auth hashing, state-key allowlist, ETag matching,
      # presigning against the AWS SDK oracle, budgets, device parsers, media ids.
      - name: Unit tests
        run: bun run test

      # Catches what svelte-check cannot: SvelteKit rejects any export from a
      # +server.ts that is not a request handler, and only the build validates
      # the adapter and wrangler.jsonc.
      - name: Build (Cloudflare adapter)
        run: bun run build

  finance-core:
    name: Finance domain — Swift tests
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - uses: actions/checkout@v4

      # Pure Foundation package: models, engine, demo. No app boot, no Xcode
      # project, no signing. Fast enough to run on every PR.
      - run: swift test

  mcp:
    name: MCP servers — tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [diet, stuff]
    defaults:
      run:
        working-directory: mcp/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun test

  meos-mcp:
    name: MeOS MCP gateway — type-check, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/meos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/meos/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
