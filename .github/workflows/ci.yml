name: CI

on:
  push:
    branches: [main]
  pull_request:

# There is no root package.json — this is a monorepo of apps/api (SvelteKit on
# Cloudflare Workers) plus two stdio MCP servers. Each job installs in its own
# directory. Swift is built locally; the app has no test target, and macOS
# runners bill at a much higher rate on private repos.
jobs:
  api:
    name: API — type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: svelte-check
        run: bun run check

      # Pure-function suites: auth hashing, state-key allowlist, ETag matching,
      # presigning against the AWS SDK oracle, budgets, device parsers, media ids.
      - name: Unit tests
        run: bun run test

      # Catches what svelte-check cannot: SvelteKit rejects any export from a
      # +server.ts that is not a request handler, and only the build validates
      # the adapter and wrangler.jsonc.
      - name: Build (Cloudflare adapter)
        run: bun run build

  mcp:
    name: MCP servers — tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [diet, stuff]
    defaults:
      run:
        working-directory: mcp/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun test
