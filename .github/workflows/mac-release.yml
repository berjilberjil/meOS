name: Build Mac app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apps/mac2
        run: xcodegen generate

      - name: Build (ad-hoc signed, no certs on CI)
        working-directory: apps/mac2
        run: xcodebuild -project meOS.xcodeproj -scheme meOS -configuration Release build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual

      - name: Zip the app
        run: |
          APP_DIR=$(xcodebuild -project apps/mac2/meOS.xcodeproj -scheme meOS -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/ BUILT_PRODUCTS_DIR =/{print $2; exit}')
          ditto -c -k --sequesterDir --keepParent "$APP_DIR/meOS.app" meOS.app.zip
          ls -lh meOS.app.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-build-${{ github.run_number }}
          name: meOS mac build ${{ github.run_number }}
          files: meOS.app.zip
