# MCP servers for Grok. Paths are relative to the repository root; launch the
# client from there. (Both servers are tracked in this repo.)

[mcp_servers.meos-diet]
command = "bun"
args = ["run", "mcp/diet/src/index.ts"]

[mcp_servers.meos-stuff]
command = "bun"
args = ["run", "mcp/stuff/src/index.ts"]
